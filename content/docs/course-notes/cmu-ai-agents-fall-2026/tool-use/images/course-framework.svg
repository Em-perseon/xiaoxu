<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="565" viewBox="0 0 1000 565"><rect width="100%" height="100%" fill="#fffff8"/><g font-family="PingFang SC, sans-serif" fill="#243247"><rect x="20" y="10" width="960" height="85" rx="12" fill="#f3f6f8" stroke="#cbd5df"/><text x="500.0" y="44" text-anchor="middle" font-size="23" font-weight="600">1. Capabilities — 工具有什么用？</text><text x="500.0" y="75" text-anchor="middle" font-size="18" font-weight="400">为什么 Agent 需要外部工具，何时应该调用工具？</text><text x="500" y="116" text-anchor="middle" font-size="24" font-weight="400">↓</text><rect x="20" y="120" width="960" height="85" rx="12" fill="#f3f6f8" stroke="#cbd5df"/><text x="500.0" y="154" text-anchor="middle" font-size="23" font-weight="600">2. Mechanics — Tool Calling 如何实现？</text><text x="500.0" y="185" text-anchor="middle" font-size="18" font-weight="400">Tool Schema、Chat Template、Parser 与 Harness 如何协同？</text><text x="500" y="226" text-anchor="middle" font-size="24" font-weight="400">↓</text><rect x="20" y="230" width="960" height="85" rx="12" fill="#f3f6f8" stroke="#cbd5df"/><text x="500.0" y="264" text-anchor="middle" font-size="23" font-weight="600">3. Constraints — 如何保证调用格式正确？</text><text x="500.0" y="295" text-anchor="middle" font-size="18" font-weight="400">JSON Schema、Constrained Decoding、XGrammar</text><text x="500" y="336" text-anchor="middle" font-size="24" font-weight="400">↓</text><rect x="20" y="340" width="960" height="85" rx="12" fill="#f3f6f8" stroke="#cbd5df"/><text x="500.0" y="374" text-anchor="middle" font-size="23" font-weight="600">4. Interfaces — 如何接入真实工具？</text><text x="500.0" y="405" text-anchor="middle" font-size="18" font-weight="400">Python Function、REST API、FastAPI、MCP</text><text x="500" y="446" text-anchor="middle" font-size="24" font-weight="400">↓</text><rect x="20" y="450" width="960" height="85" rx="12" fill="#f3f6f8" stroke="#cbd5df"/><text x="500.0" y="484" text-anchor="middle" font-size="23" font-weight="600">5. Systems &amp; Evaluation — 如何让工具调用可靠且高效？</text><text x="500.0" y="515" text-anchor="middle" font-size="18" font-weight="400">并行执行、异常处理、端到端评估</text></g></svg>