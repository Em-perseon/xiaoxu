<svg xmlns="http://www.w3.org/2000/svg" width="960" height="610" viewBox="0 0 960 610"><rect width="960" height="610" rx="12" fill="#fffff8"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#55718b"/></marker></defs><g font-family="PingFang SC, sans-serif" text-anchor="middle"><rect x="120" y="20" width="720" height="100" rx="12" fill="#edf2f5" stroke="#bac9d5"/><text x="480" y="60" font-size="28" fill="#243247">共享 Agent / ReAct 循环</text><text x="480" y="96" font-size="21" fill="#243247">组织消息 → 请求模型 → 执行工具 → 追加观察 → 继续或结束</text><path d="M480 120 L160 170" fill="none" stroke="#55718b" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="175" width="280" height="185" rx="12" fill="#edf2f5" stroke="#bac9d5"/><text x="160" y="212" font-size="24" fill="#243247">Part 1 · CodeAgent</text><text x="160" y="251" font-size="19" fill="#243247">终端操作 + 技能发现</text><text x="160" y="286" font-size="19" fill="#243247">让模型生成修复补丁</text><text x="160" y="321" font-size="19" fill="#243247">在新环境验证修复</text><path d="M480 120 L480 170" fill="none" stroke="#55718b" stroke-width="2" marker-end="url(#arrow)"/><rect x="340" y="175" width="280" height="185" rx="12" fill="#edf2f5" stroke="#bac9d5"/><text x="480" y="212" font-size="24" fill="#243247">Part 2 · Context</text><text x="480" y="251" font-size="19" fill="#243247">复用 CodeAgent 处理长任务</text><text x="480" y="286" font-size="19" fill="#243247">压缩旧历史，保留关键状态</text><text x="480" y="321" font-size="19" fill="#243247">比较完整上下文与压缩组</text><path d="M480 120 L800 170" fill="none" stroke="#55718b" stroke-width="2" marker-end="url(#arrow)"/><rect x="660" y="175" width="280" height="185" rx="12" fill="#edf2f5" stroke="#bac9d5"/><text x="800" y="212" font-size="24" fill="#243247">Part 3 · ChessAgent</text><text x="800" y="251" font-size="19" fill="#243247">棋局观察 + 落子工具</text><text x="800" y="286" font-size="19" fill="#243247">模拟 + Python + 选棋技能</text><text x="800" y="321" font-size="19" fill="#243247">比较观察方式与行动轨迹</text><text x="480" y="414" font-size="22" fill="#243247">环境依赖：修复后的棋类应用，才是 ChessAgent 的行动环境</text><rect x="20" y="450" width="170" height="70" rx="12" fill="#edf2f5" stroke="#bac9d5"/><text x="105.0" y="493" font-size="22" fill="#243247">CodeAgent</text><rect x="245" y="450" width="180" height="70" rx="12" fill="#edf2f5" stroke="#bac9d5"/><text x="335.0" y="493" font-size="22" fill="#243247">fix.patch</text><rect x="480" y="450" width="220" height="70" rx="12" fill="#edf2f5" stroke="#bac9d5"/><text x="590.0" y="493" font-size="22" fill="#243247">修复后的棋类应用</text><rect x="755" y="450" width="185" height="70" rx="12" fill="#edf2f5" stroke="#bac9d5"/><text x="847.5" y="493" font-size="22" fill="#243247">ChessAgent</text><path d="M190 485 L240 485" fill="none" stroke="#55718b" stroke-width="2" marker-end="url(#arrow)"/><path d="M425 485 L475 485" fill="none" stroke="#55718b" stroke-width="2" marker-end="url(#arrow)"/><path d="M705 485 L750 485" fill="none" stroke="#55718b" stroke-width="2" marker-end="url(#arrow)"/><text x="480" y="568" font-size="20" fill="#243247">Part 2 使用独立的 Django 修复任务，评估上下文压缩的效果。</text></g></svg>