<svg xmlns="http://www.w3.org/2000/svg" width="900" height="345" viewBox="0 0 900 345"><rect width="900" height="345" fill="#fffff8"/><g font-family="PingFang SC, sans-serif" text-anchor="middle"><rect x="30" y="10" width="840" height="60" rx="8" fill="#edf2f5" stroke="#bac9d5"/><text x="450" y="35" font-size="20" fill="#243247">植入任务状态与约束</text><text x="450" y="57" font-size="16" fill="#465c70">约束、决策与证据</text><path d="M450 71 v16 m-5 -5 l5 5 l5 -5" fill="none" stroke="#3974aa" stroke-width="2"/><rect x="30" y="90" width="840" height="60" rx="8" fill="#edf2f5" stroke="#bac9d5"/><text x="450" y="115" font-size="20" fill="#243247">执行上下文压缩</text><text x="450" y="137" font-size="16" fill="#465c70">应用实际管理策略</text><path d="M450 151 v16 m-5 -5 l5 5 l5 -5" fill="none" stroke="#3974aa" stroke-width="2"/><rect x="30" y="170" width="840" height="60" rx="8" fill="#edf2f5" stroke="#bac9d5"/><text x="450" y="195" font-size="20" fill="#243247">恢复 Agent 继续任务</text><text x="450" y="217" font-size="16" fill="#465c70">观察压缩后的行为</text><path d="M450 231 v16 m-5 -5 l5 5 l5 -5" fill="none" stroke="#3974aa" stroke-width="2"/><rect x="30" y="250" width="840" height="60" rx="8" fill="#edf2f5" stroke="#bac9d5"/><text x="450" y="275" font-size="20" fill="#243247">检查后续决策</text><text x="450" y="297" font-size="16" fill="#465c70">约束遵守率、任务成功率与 token 成本</text></g></svg>