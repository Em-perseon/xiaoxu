<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 0 1200 510"><rect width="100%" height="100%" fill="#fffff8"/><g font-family="PingFang SC, sans-serif" fill="#151515"><rect x="8" y="8" width="1184" height="494" rx="14" fill="none" stroke="#dcdcdc" stroke-width="1.5"/><text x="600" y="75" font-size="28" text-anchor="middle" font-weight="600">Agent 长期运行</text><text x="600" y="112" font-size="22" text-anchor="middle" font-weight="400">历史消息、工具调用与环境观察持续增长</text><text x="600" y="166" font-size="28" text-anchor="middle" font-weight="400">↓</text><text x="45" y="238" font-size="28" text-anchor="start" font-weight="600">Model 层</text><text x="45" y="277" font-size="20" text-anchor="start" font-weight="400">高效 Attention、位置编码、长上下文训练</text><text x="625" y="238" font-size="28" text-anchor="start" font-weight="600">Harness 层</text><text x="625" y="277" font-size="20" text-anchor="start" font-weight="400">KV Cache、Prompt Caching、Context Compaction</text><text x="600" y="333" font-size="28" text-anchor="middle" font-weight="400">↓</text><rect x="28" y="365" width="1144" height="112" rx="14" fill="none" stroke="#dcdcdc" stroke-width="1.5"/><text x="600" y="409" font-size="28" text-anchor="middle" font-weight="600">更低成本、更稳定的长程 Agent</text><text x="600" y="447" font-size="22" text-anchor="middle" font-weight="400">保留任务相关的信息，而不是无条件保存所有历史</text></g></svg>