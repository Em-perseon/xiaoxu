<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="260" viewBox="0 0 1100 260"><rect width="100%" height="100%" fill="#fffff8"/><g font-family="PingFang SC, sans-serif" fill="#151515"><rect x="12" y="12" width="526" height="230" rx="14" fill="none" stroke="#dcdcdc" stroke-width="1.5"/><text x="37" y="57" font-size="30" text-anchor="start" font-weight="600">Prefill</text><text x="37" y="99" font-size="22" text-anchor="start" font-weight="600">处理输入阶段</text><text x="37" y="145" font-size="18" text-anchor="start" font-weight="400">处理提示中的所有 token，并生成相应的 KV 状态。</text><text x="37" y="203" font-size="18" text-anchor="start" font-weight="400">计算密集 · 主要影响 TTFT</text><rect x="562" y="12" width="526" height="230" rx="14" fill="none" stroke="#dcdcdc" stroke-width="1.5"/><text x="587" y="57" font-size="30" text-anchor="start" font-weight="600">Decode</text><text x="587" y="99" font-size="22" text-anchor="start" font-weight="600">生成输出阶段</text><text x="587" y="145" font-size="18" text-anchor="start" font-weight="400">逐个生成 token，读取历史 KV 状态并不断追加。</text><text x="587" y="203" font-size="18" text-anchor="start" font-weight="400">顺序执行 · 常受内存带宽限制</text></g></svg>