<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Agent Evaluation Harness 分层结构</title>
  <desc id="desc">从实验输入、交互执行、证据评分到质量治理与线上失败回流的 Agent 评测结构。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#51606f"/>
    </marker>
    <marker id="arrow-accent" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#9a5b3d"/>
    </marker>
    <style>
      .band { fill: #f7f6f1; stroke: #c8c5bb; stroke-width: 1.5; }
      .box { fill: #fffef9; stroke: #6d7782; stroke-width: 1.5; }
      .box-blue { fill: #eef3f7; stroke: #64798d; stroke-width: 1.7; }
      .box-warm { fill: #f7eee8; stroke: #9a684e; stroke-width: 1.7; }
      .box-green { fill: #edf4ef; stroke: #66806d; stroke-width: 1.7; }
      .label { fill: #6a6a63; font: 600 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 1.5px; }
      .title { fill: #1f272d; font: 650 22px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .body { fill: #3d474e; font: 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .small { fill: #59636a; font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .line { fill: none; stroke: #51606f; stroke-width: 2; marker-end: url(#arrow); }
      .line-soft { fill: none; stroke: #7d878f; stroke-width: 1.6; marker-end: url(#arrow); }
      .feedback { fill: none; stroke: #9a5b3d; stroke-width: 2.2; stroke-dasharray: 8 6; marker-end: url(#arrow-accent); }
    </style>
  </defs>

  <rect x="24" y="22" width="1152" height="130" rx="18" class="band"/>
  <text x="50" y="52" class="label">01 · 实验契约</text>
  <rect x="52" y="72" width="245" height="58" rx="11" class="box"/>
  <text x="174.5" y="96" text-anchor="middle" class="title">测试用例</text>
  <text x="174.5" y="118" text-anchor="middle" class="small">目标 · 初始状态 · 可评分条件</text>
  <rect x="322" y="72" width="245" height="58" rx="11" class="box"/>
  <text x="444.5" y="96" text-anchor="middle" class="title">交互环境</text>
  <text x="444.5" y="118" text-anchor="middle" class="small">状态 · 工具 · 权限 · 转移规则</text>
  <rect x="592" y="72" width="245" height="58" rx="11" class="box"/>
  <text x="714.5" y="96" text-anchor="middle" class="title">Agent Stack</text>
  <text x="714.5" y="118" text-anchor="middle" class="small">模型 · Prompt · Memory · Adapter</text>
  <rect x="862" y="72" width="286" height="58" rx="11" class="box"/>
  <text x="1005" y="96" text-anchor="middle" class="title">实验控制</text>
  <text x="1005" y="118" text-anchor="middle" class="small">Seed · Budget · Stop · Version</text>

  <path d="M175 130 V181" class="line-soft"/>
  <path d="M445 130 V181" class="line-soft"/>
  <path d="M715 130 V181" class="line-soft"/>
  <path d="M1005 130 V181" class="line-soft"/>

  <rect x="24" y="178" width="1152" height="244" rx="18" class="band"/>
  <text x="50" y="209" class="label">02 · 交互执行</text>
  <rect x="72" y="229" width="1056" height="64" rx="12" class="box-blue"/>
  <text x="600" y="256" text-anchor="middle" class="title">Evaluation Harness / Runner</text>
  <text x="600" y="280" text-anchor="middle" class="body">重置环境 · 注入上下文 · 路由工具 · 控制预算与停止条件 · 捕获异常</text>

  <rect x="96" y="329" width="260" height="66" rx="12" class="box"/>
  <text x="226" y="357" text-anchor="middle" class="title">Agent</text>
  <text x="226" y="381" text-anchor="middle" class="small">读取 observation，选择 action</text>
  <rect x="470" y="329" width="260" height="66" rx="12" class="box"/>
  <text x="600" y="357" text-anchor="middle" class="title">Environment + Tools</text>
  <text x="600" y="381" text-anchor="middle" class="small">执行动作，改变并返回世界状态</text>
  <rect x="844" y="329" width="260" height="66" rx="12" class="box-warm"/>
  <text x="974" y="357" text-anchor="middle" class="title">Trajectory Recorder</text>
  <text x="974" y="381" text-anchor="middle" class="small">事件 · 快照 · 延迟 · 成本 · 异常</text>

  <path d="M356 349 H470" class="line"/>
  <text x="413" y="339" text-anchor="middle" class="small">action</text>
  <path d="M470 379 H356" class="line"/>
  <text x="413" y="399" text-anchor="middle" class="small">observation</text>
  <path d="M730 362 H844" class="line-soft"/>

  <path d="M974 395 V466" class="line-soft"/>
  <path d="M600 422 V466" class="line-soft"/>

  <rect x="24" y="463" width="1152" height="154" rx="18" class="band"/>
  <text x="50" y="494" class="label">03 · 证据与评分</text>
  <rect x="58" y="516" width="250" height="76" rx="12" class="box"/>
  <text x="183" y="545" text-anchor="middle" class="title">运行证据</text>
  <text x="183" y="570" text-anchor="middle" class="small">Final State + Trajectory + Artifacts</text>
  <rect x="372" y="516" width="294" height="76" rx="12" class="box-green"/>
  <text x="519" y="545" text-anchor="middle" class="title">Grader Stack</text>
  <text x="519" y="570" text-anchor="middle" class="small">状态检查 · 轨迹规则 · LLM / Human</text>
  <rect x="730" y="516" width="412" height="76" rx="12" class="box"/>
  <text x="936" y="545" text-anchor="middle" class="title">Metric Vector</text>
  <text x="936" y="570" text-anchor="middle" class="small">Outcome · Efficiency · Reliability · Safety · Calibration</text>
  <path d="M308 554 H372" class="line"/>
  <path d="M666 554 H730" class="line"/>

  <path d="M936 592 V663" class="line-soft"/>
  <rect x="24" y="656" width="1152" height="82" rx="18" class="band"/>
  <text x="50" y="687" class="label">04 · 质量治理与回流</text>
  <text x="294" y="704" text-anchor="middle" class="title">可靠性复跑</text>
  <text x="550" y="704" text-anchor="middle" class="title">安全与策略检查</text>
  <text x="807" y="704" text-anchor="middle" class="title">Benchmark Audit</text>
  <text x="1043" y="704" text-anchor="middle" class="title">线上失败挖掘</text>

  <path d="M1043 721 C1043 738, 32 742, 32 690 L32 126 C32 110, 40 101, 52 101" class="feedback"/>
  <rect x="425" y="714" width="350" height="22" rx="6" fill="#f7f6f1"/>
  <text x="600" y="730" text-anchor="middle" class="small" fill="#9a5b3d">线上 failure cluster → 新的 regression case</text>
</svg>
